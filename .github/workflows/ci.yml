name: CI

on:
  push:
    branches:
      - master
      - 'release/*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test_debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++
    
    - name: Configure CMake (Debug)
      run: |
        mkdir -p build-debug
        cd build-debug
        cmake -DCMAKE_BUILD_TYPE=debug ..
    
    - name: Build (Debug)
      run: |
        cd build-debug
        make
    
    - name: Run tests (Debug)
      run: |
        cd build-debug
        ctest --output-on-failure

  test_release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++
    
    - name: Configure CMake (Release)
      run: |
        mkdir -p build-release
        cd build-release
        cmake -DCMAKE_BUILD_TYPE=release ..
    
    - name: Build (Release)
      run: |
        cd build-release
        make
    
    - name: Run tests (Release)
      run: |
        cd build-release
        ctest --output-on-failure

  test_clang_libcxx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang libc++-dev libc++abi-dev
    
    - name: Configure CMake (Debug, clang + libc++)
      run: |
        mkdir -p build-clang
        cd build-clang
        cmake -DCMAKE_BUILD_TYPE=debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-stdlib=libc++ ..
    
    - name: Build (Debug, clang + libc++)
      run: |
        cd build-clang
        make
    
    - name: Run tests (Debug, clang + libc++)
      run: |
        cd build-clang
        ctest --output-on-failure

  test_msvc:
    runs-on: windows-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Configure CMake (Debug, MSVC)
      run: |
        cmake -B build-msvc -DCMAKE_BUILD_TYPE=Debug .
    
    - name: Build (Debug, MSVC)
      run: |
        cmake --build build-msvc --config Debug
    
    - name: Run tests (Debug, MSVC)
      run: |
        ctest --test-dir build-msvc -C Debug --output-on-failure
